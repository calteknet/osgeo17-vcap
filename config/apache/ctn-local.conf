<VirtualHost *:80>
    ServerName index.localhost
    DocumentRoot /home/kmw/osgeo17-vcap/dashboard
    <Directory /home/kmw/osgeo17-vcap/dashboard>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName elpx.localhost
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8084/
    ProxyPassReverse / http://127.0.0.1:8084/
</VirtualHost>

<VirtualHost *:80>
    ServerName exe.localhost
