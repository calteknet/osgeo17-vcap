# live-osgoe-ctn-vcap — Elgg stack · CTN VCAP Nomadic Classroom (OSGeoLive 17)
# Repo: github.com/calteknet/osgeo17-vcap · Managed via Portainer
# Host config files: /mnt/p4/home/kmw/config/elgg/
#   nginx.conf · php-overrides.ini · settings.php
version: '3.8'
networks:
  vcap_net:
    external: true
    name: vcap_net
volumes:
  elgg_mariadb:
  elgg_data:
  elgg_static:
  elgg_db_backup:
  elgg_backup:
services:
  db:
    image: mariadb:11.4
    container_name: elgg_db
    restart: unless-stopped
    environment:
      MARIADB_USER: ctn
      MARIADB_PASSWORD: "${ELGG_DB_PASSWORD}"
      MARIADB_DATABASE: elgg
      MARIADB_ROOT_PASSWORD: "${ELGG_DB_ROOT_PASSWORD}"
    volumes:
      - elgg_mariadb:/var/lib/mysql
      - elgg_db_backup:/backup
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 90s
    networks:
      - vcap_net
  elgg:
    image: calteknet/elgg:latest
    container_name: php-fpm
    restart: unless-stopped
    user: root
    depends_on:
      - db
    volumes:
      - elgg_static:/opt/static
      - elgg_data:/opt/data
      - elgg_backup:/backup
      - /mnt/p4/home/kmw/config/elgg/php-overrides.ini:/usr/local/etc/php/conf.d/zz-vcap.ini:ro
      - /mnt/p4/home/kmw/config/elgg/settings.php:/elgg/elgg-config/settings.php:ro
    networks:
      - vcap_net
  nginx:
    image: nginx:stable
    container_name: elgg_nginx
    restart: unless-stopped
    depends_on:
      - elgg
    ports:
      - "8086:80"
    volumes:
      - elgg_static:/opt/static
      - /mnt/p4/home/kmw/config/elgg/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - vcap_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.elgg.rule=Host(`elgg.localhost`)"
      - "traefik.http.routers.elgg.entrypoints=web"
      - "traefik.http.services.elgg.loadbalancer.server.port=80"
  backup:
    image: alpine:latest
    container_name: elgg_backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MARIADB_ROOT_PASSWORD: "${ELGG_DB_ROOT_PASSWORD}"
    volumes:
      - elgg_data:/source/elgg:ro
      - elgg_static:/source/static:ro
      - elgg_db_backup:/backup/db
      - elgg_backup:/backup/elgg
    command: sh -c "apk add --no-cache mariadb-client gzip tar && while true; do DATE=$$(date +%Y%m%d_%H%M%S); if mariadb-dump -h elgg_db -u root -p$$MARIADB_ROOT_PASSWORD --all-databases --single-transaction | gzip > /backup/db/db_$$DATE.sql.gz; then echo backup db OK $$DATE; find /backup/db -name 'db_*.sql.gz' -mtime +14 -delete; else echo backup db FAILED $$DATE; rm -f /backup/db/db_$$DATE.sql.gz; fi; tar -czf /backup/elgg/elgg_$$DATE.tar.gz -C /source/elgg .; tar -czf /backup/elgg/static_$$DATE.tar.gz -C /source/static .; find /backup/elgg -name '*.tar.gz' -mtime +14 -delete; sleep 86400; done"
    networks:
      - vcap_net
