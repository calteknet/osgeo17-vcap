version: '3.8'
networks:
  vcap_net:
    external: true
    name: vcap_net
services:
  slides:
    image: nginx:stable
    container_name: vcap_slides
    restart: unless-stopped
    networks:
      - vcap_net
    ports:
      - "8085:80"
    volumes:
      - /mnt/p4/home/kmw/vcap/slides:/usr/share/nginx/html:ro
      - /mnt/p4/home/kmw/config/slides/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.slides.rule=Host(`caltek.net`) && PathPrefix(`/slides`)"
      - "traefik.http.routers.slides.entrypoints=web"
      - "traefik.http.middlewares.slides-strip.stripprefix.prefixes=/slides"
      - "traefik.http.routers.slides.middlewares=slides-strip"
      - "traefik.http.services.slides.loadbalancer.server.port=80"
