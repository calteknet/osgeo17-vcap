version: '3.8'
# STACK: elgg-local (mirrors prod ctn-elgg / idea.caltek.net)
# DOMAIN: http://idea.localhost/  (alias elgg.localhost; :8086 fallback)
networks:
  elgg-net:
    driver: overlay
volumes:
  mariadb-data:  { external: true, name: elgg_mariadb }
  elgg-data:     { external: true, name: elgg_data }
  static-data:   { external: true, name: elgg_static }
  db-backup:     { external: true, name: elgg_db_backup }
  elgg-backup:   { external: true, name: elgg_backup }
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_USER: ctn
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: elgg
    volumes:
      - mariadb-data:/var/lib/mysql
      - db-backup:/backup
    networks: [elgg-net]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure, delay: 10s }
      resources: { limits: { cpus: '0.50', memory: 512M } }
  elgg:
    image: calteknet/elgg:latest
    user: root
    volumes:
      - static-data:/opt/static
      - elgg-data:/opt/data
      - elgg-backup:/backup
      - /mnt/p4/home/kmw/config/elgg/php-overrides.ini:/usr/local/etc/php/conf.d/zz-vcap.ini:ro
      - /mnt/p4/home/kmw/config/elgg/settings.php:/elgg/elgg-config/settings.php:ro
    networks:
      elgg-net:
        aliases: [php-fpm]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure, delay: 10s }
      resources: { limits: { cpus: '0.70', memory: 768M } }
  nginx:
    image: nginx:stable
    volumes:
      - static-data:/opt/static
      - /mnt/p4/home/kmw/config/elgg/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8086:80"
    networks: [elgg-net]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure, delay: 10s }
      resources: { limits: { cpus: '0.30', memory: 256M } }
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.elgg-local.rule=Host(`idea.localhost`) || Host(`elgg.localhost`)"
        - "traefik.http.routers.elgg-local.entrypoints=web"
        - "traefik.http.services.elgg-local.loadbalancer.server.port=80"
  backup:
    image: alpine:latest
    environment:
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - elgg-data:/source/elgg:ro
      - static-data:/source/static:ro
      - db-backup:/backup/db
      - elgg-backup:/backup/elgg
    command: sh -c "apk add --no-cache mariadb-client gzip tar && while true; do DATE=$$(date +%Y%m%d_%H%M%S); if mariadb-dump -h db -u ctn -p$$MARIADB_PASSWORD elgg --single-transaction | gzip > /backup/db/db_$$DATE.sql.gz; then echo backup db OK $$DATE; find /backup/db -name 'db_*.sql.gz' -mtime +14 -delete; else echo backup db FAILED $$DATE; rm -f /backup/db/db_$$DATE.sql.gz; fi; tar -czf /backup/elgg/elgg_$$DATE.tar.gz -C /source/elgg .; tar -czf /backup/elgg/static_$$DATE.tar.gz -C /source/static .; find /backup/elgg -name '*.tar.gz' -mtime +14 -delete; sleep 86400; done"
    networks: [elgg-net]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure, delay: 10s }
      resources: { limits: { cpus: '0.10', memory: 64M } }
